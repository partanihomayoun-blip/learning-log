<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone Practice</title>
</head>
<body>
    <header>
        <nav aria-label="header-navigation">
            <a href="https://images.google.com" target="_blank" rel="noopener noreferrer">images</a>
            <a href="https://mail.google.com" target="_blank" rel="noopener noreferrer">gmail</a>
        </nav>
        <h1>google</h1>
        <p>my first practice of google clone</p>
    </header>

    <main>
        <search>
            <form action="https://google.com/search" method="get">
                <label for="search-query">search</label>
                <input
                    type="search"
                    id="search-query"
                    name="q"
                    placeholder="search anything on google.com"
                    dir="auto"
                    required
                >
                <button type="submit">search</button>
                <button type="button">i'm feeling lucky</button>
            </form>
        </search>
    </main>

    <footer aria-label="site footer">
        <div>
            <ul aria-label="company info links">
                <li><a href="#">about</a></li>
                <li><a href="#">advertising</a></li>
                <li><a href="#">business</a></li>
                <li><a href="#">how search works</a></li>
            </ul>
        </div>
        <div>
            <ul aria-label="legal and settings link">
                <li><a href="#">privacy</a></li>
                <li><a href="#">terms</a></li>
                <li><a href="#">settings</a></li>
            </ul>
        </div>
    </footer>
</body>
</html>
